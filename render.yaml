services:
  # FastAPI backend, native Python runtime (no Docker)
  - type: web
    name: parkingnav-api
    runtime: python
    plan: free  # sleeps when idle and loses the SQLite DB on restart
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn digital_twin.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PARKINGNAV_API_KEY      # guards write endpoints (count entry etc.)
        generateValue: true
      - key: PARKINGNAV_ALLOWED_ORIGINS
        value: "*"                   # restrict to your Vercel/Netlify URLs after first deploy
