services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PARKINGNAV_DB_PATH=/app/db/digital_twin.db   # persisted in the named volume below
      # For a public deployment, set these in a .env file next to this one:
      - PARKINGNAV_API_KEY=${PARKINGNAV_API_KEY:-}
      - PARKINGNAV_ALLOWED_ORIGINS=${PARKINGNAV_ALLOWED_ORIGINS:-*}
    volumes:
      - dbdata:/app/db
      - ./experiments:/app/experiments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  dbdata:
