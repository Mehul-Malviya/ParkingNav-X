# VIT-AP Campus Configuration v2.0 - FIXED & COMPLETE
# =====================================================
# IMPROVEMENTS:
# ✅ Gate & parking lot have DIFFERENT coordinates (no conflict)
# ✅ Multiple parking lots (5 total) for realistic multi-lot optimization
# ✅ Travel times calibrated to vehicle speed (5 m/s = 18 km/h campus speed)
# ✅ Complete bidirectional road network (no orphaned nodes)
# ✅ Reverse edges so vehicles can return
# ✅ All capacity values realistic and non-zero
# ✅ All foreign keys valid, no NULL values

campus:
  campus_id: vitap
  name: VIT-AP University
  description: Amaravati, Andhra Pradesh, India. Complete campus model with multiple parking zones.
  timezone: Asia/Kolkata
  configuration_version: VITAP_CONFIG_V2

# =====================================================
# GATES (Entry/Exit Points) - 2 gates for realism
# =====================================================
gates:
  # Main gate - entrance to main campus area
  # ASSUMED: 2 lanes × 3 veh/min/lane = 6 veh/min service rate (no measurement available)
  - gate_id: vitap-gate-main
    name: "Main Gate"
    latitude: 16.496961
    longitude: 80.4992829
    capacity: 6
    status: open
    metadata:
      gate_type: "main"
      vehicle_types: ["car", "two-wheeler", "bus"]
      entry_exit_direction: "bidirectional"
      peak_throughput_per_hour: 150

  # Visitor/Secondary gate
  # ASSUMED: 1 lane × 3 veh/min/lane = 3 veh/min service rate (no measurement available)
  - gate_id: vitap-gate-visitor
    name: "Visitor Gate"
    latitude: 16.494412
    longitude: 80.5016141
    capacity: 3
    status: open
    metadata:
      gate_type: "visitor"
      vehicle_types: ["car", "two-wheeler"]
      entry_exit_direction: "bidirectional"
      peak_throughput_per_hour: 80

# =====================================================
# PARKING LOTS (5 zones with realistic capacities)
# =====================================================
parking_lots:
  # Zone A: Main academic block parking
  - parking_lot_id: vitap-lot-academic-main
    name: "Academic Block Main Lot"
    latitude: 16.4945668
    longitude: 80.500353
    zone: "academic_zone"
    boundary_polygon: "POLYGON((16.493000 80.499000, 16.494000 80.499000, 16.494000 80.500000, 16.493000 80.500000, 16.493000 80.499000))"
    total_capacity: 120
    usable_capacity: 108
    reserved_capacity: 8
    restricted_capacity: 4
    temporarily_unavailable_capacity: 0
    status: open
    metadata:
      lot_type: "faculty_and_students"
      access_level: "all"
      vehicle_types: ["car", "two-wheeler"]

  # Zone B: Hostel parking (large lot)
  - parking_lot_id: vitap-lot-hostel
    name: "Hostel Zone Parking"
    latitude: 16.4932384
    longitude: 80.5008032
    zone: "hostel_zone"
    boundary_polygon: "POLYGON((16.491000 80.500300, 16.492000 80.500300, 16.492000 80.501300, 16.491000 80.501300, 16.491000 80.500300))"
    total_capacity: 180
    usable_capacity: 162
    reserved_capacity: 12
    restricted_capacity: 6
    temporarily_unavailable_capacity: 0
    status: open
    metadata:
      lot_type: "student_residents"
      access_level: "hostel_students"
      vehicle_types: ["car", "two-wheeler"]

  # Zone C: Administrative & visitor parking
  - parking_lot_id: vitap-lot-admin-visitor
    name: "Administrative & Visitor Lot"
    latitude: 16.495002
    longitude: 80.500907
    zone: "admin_zone"
    boundary_polygon: "POLYGON((16.492300 80.497700, 16.493300 80.497700, 16.493300 80.498700, 16.492300 80.498700, 16.492300 80.497700))"
    total_capacity: 80
    usable_capacity: 72
    reserved_capacity: 5
    restricted_capacity: 3
    temporarily_unavailable_capacity: 0
    status: open
    metadata:
      lot_type: "admin_and_visitors"
      access_level: "admin_and_visitors"
      vehicle_types: ["car", "two-wheeler"]

  # Zone D: Sports & recreation parking
  - parking_lot_id: vitap-lot-sports
    name: "Sports & Recreation Lot"
    latitude: 16.4932758
    longitude: 80.4961327
    zone: "sports_zone"
    boundary_polygon: "POLYGON((16.494700 80.498500, 16.495700 80.498500, 16.495700 80.499500, 16.494700 80.499500, 16.494700 80.498500))"
    total_capacity: 100
    usable_capacity: 84
    reserved_capacity: 7
    restricted_capacity: 3
    temporarily_unavailable_capacity: 6
    status: open
    metadata:
      lot_type: "event_and_sports"
      access_level: "all"
      vehicle_types: ["car", "two-wheeler"]

  # Zone E: Overflow parking (opened during peak hours)
  - parking_lot_id: vitap-lot-overflow
    name: "Overflow Parking"
    latitude: 16.4966575
    longitude: 80.4991991
    zone: "overflow_zone"
    boundary_polygon: "POLYGON((16.489500 80.496500, 16.490500 80.496500, 16.490500 80.497500, 16.489500 80.497500, 16.489500 80.496500))"
