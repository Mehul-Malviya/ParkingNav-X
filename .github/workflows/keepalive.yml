name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"   # Render free tier sleeps after ~15 min idle
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS -m 90 --retry 3 --retry-delay 10 https://parkingnav-x-isgs.onrender.com/ || true
